<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeSub Pro - Subscription Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; transition: all 0.4s ease; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: white; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .gradient-primary { background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%); }
        .btn-primary { background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%); transition: all 0.3s ease; color: white; font-weight: 600; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); }
        input, select { background: rgba(15, 23, 42, 0.8) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; }
        .status-active { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="auth-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-card p-8 md:p-12 max-w-md w-full text-center">
            <div class="mb-6">
                <div class="w-20 h-20 mx-auto mb-4 gradient-primary rounded-3xl flex items-center justify-center text-4xl">💎</div>
                <h1 class="text-4xl font-bold mb-3 bg-gradient-to-r from-sky-400 to-cyan-400 bg-clip-text text-transparent">VibeSub Pro</h1>
                <p class="text-slate-400 text-lg" id="auth-subtitle">智能管理你的每一筆訂閱</p>
            </div>
            <button onclick="login()" class="w-full flex items-center justify-center gap-3 bg-slate-800 border border-slate-700 py-4 px-6 rounded-2xl hover:bg-slate-700 transition-all">
                <span id="login-btn-text">使用 Google 帳號登入</span>
            </button>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold" id="welcome-text">歡迎回來 👋</h1>
                <span id="user-email" class="text-slate-400 text-sm"></span>
            </div>
            <div class="flex gap-3">
                <select id="lang-selector" onchange="changeLang()" class="glass-card px-4 py-2 text-sm border-0 cursor-pointer outline-none">
                    <option value="zh-TW">繁體中文</option>
                    <option value="en">English</option>
                </select>
                <button onclick="logout()" class="glass-card px-6 py-2 text-red-400 font-semibold hover:bg-red-900/20" id="logout-btn">登出</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <div class="glass-card p-6">
                    <h3 class="text-xl font-bold mb-6" id="form-title">✨ 新增訂閱服務</h3>
                    <form id="sub-form" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-2" id="label-name">服務名稱</label>
                                <input type="text" id="name" placeholder="Netflix..." class="w-full p-3 rounded-xl outline-none" required>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-2" id="label-category">分類</label>
                                <select id="category-select" class="w-full p-3 rounded-xl outline-none">
                                    <option value="Entertainment">🎬 娛樂</option>
                                    <option value="Music">🎵 音樂</option>
                                    <option value="Cloud">☁️ 雲端</option>
                                    <option value="Tools">💻 工具</option>
                                    <option value="Other">📦 其他</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-2" id="label-currency">幣別</label>
                                <select id="input_currency" class="w-full p-3 rounded-xl outline-none">
                                    <option value="TWD">TWD</option>
                                    <option value="USD">USD</option>
                                    <option value="JPY">JPY</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-2" id="label-amount">金額</label>
                                <input type="number" id="input_price" step="0.01" class="w-full p-3 rounded-xl outline-none" required>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-2" id="label-cycle">週期</label>
                                <select id="input_cycle" class="w-full p-3 rounded-xl outline-none">
                                    <option value="monthly">每月</option>
                                    <option value="yearly">每年</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-2" id="label-date">扣款日</label>
                                <input type="number" id="input_date" min="1" max="31" class="w-full p-3 rounded-xl outline-none" required>
                            </div>
                        </div>
                        <button type="submit" class="w-full btn-primary py-4 rounded-xl font-bold" id="add-btn">➕ 新增訂閱</button>
                    </form>
                </div>

                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold" id="list-title">📋 訂閱清單</h3>
                        <div class="text-2xl font-bold text-emerald-400" id="monthly-total-display">NT$ 0</div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="text-slate-400 text-xs uppercase">
                                <tr class="border-b border-slate-700">
                                    <th class="pb-4">Status</th>
                                    <th class="pb-4" id="th-name">服務</th>
                                    <th class="pb-4" id="th-cycle">週期</th>
                                    <th class="pb-4 text-right" id="th-cost">月均費用 (TWD)</th>
                                    <th class="pb-4"></th>
                                </tr>
                            </thead>
                            <tbody id="sub-list" class="divide-y divide-slate-800"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="glass-card p-6">
                    <h3 class="font-bold mb-4" id="chart-title">📊 支出分析</h3>
                    <div class="h-64 relative"><canvas id="categoryChart"></canvas></div>
                </div>
                <div class="glass-card p-6">
                    <h3 class="font-bold mb-4" id="upcoming-title">🔔 即將扣款 (7天內)</h3>
                    <div id="upcoming-list" class="space-y-3 text-sm"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient("https://xqeqjwukfkdluwjchydq.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxZXFqd3VrZmtkbHV3amNoeWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDA1OTIsImV4cCI6MjA5MzU3NjU5Mn0.tO3qfj5DnnK-U2uHxVWLcrCfpyXsqzBeC29Pezi4Z00");

        const i18n = {
            "zh-TW": {
                welcome: "歡迎回來 👋", logout: "登出", formTitle: "✨ 新增訂閱服務", listTitle: "📋 訂閱清單",
                thName: "服務", thCycle: "週期", thCost: "月均費用 (TWD)", addBtn: "➕ 新增訂閱",
                monthly: "每月", yearly: "每年", today: "今日", tomorrow: "明日", daysLeft: "天後",
                authSubtitle: "智能管理你的每一筆訂閱", loginBtn: "使用 Google 帳號登入",
                labelName: "服務名稱", labelCategory: "分類", labelCurrency: "幣別", labelAmount: "金額",
                labelCycle: "週期", labelDate: "扣款日", chartTitle: "📊 支出分析", upcomingTitle: "🔔 即將扣款 (7天內)",
                categories: { Entertainment: "🎬 娛樂", Music: "🎵 音樂", Cloud: "☁️ 雲端", Tools: "💻 工具", Other: "📦 其他" },
                confirmDelete: "確定要刪除嗎？", noData: "暫無資料"
            },
            "en": {
                welcome: "Welcome Back 👋", logout: "Logout", formTitle: "✨ Add Subscription", listTitle: "📋 Subscriptions",
                thName: "Service", thCycle: "Cycle", thCost: "Monthly (TWD)", addBtn: "➕ Add Sub",
                monthly: "Monthly", yearly: "Yearly", today: "Today", tomorrow: "Tomorrow", daysLeft: "days left",
                authSubtitle: "Smart management for your subscriptions", loginBtn: "Sign in with Google",
                labelName: "Service Name", labelCategory: "Category", labelCurrency: "Currency", labelAmount: "Amount",
                labelCycle: "Cycle", labelDate: "Billing Date", chartTitle: "📊 Analysis", upcomingTitle: "🔔 Upcoming (7 days)",
                categories: { Entertainment: "🎬 Entertainment", Music: "🎵 Music", Cloud: "☁️ Cloud", Tools: "💻 Tools", Other: "📦 Other" },
                confirmDelete: "Are you sure?", noData: "No data"
            }
        };

        let currentLang = localStorage.getItem('preferredLang') || 'zh-TW';
        let allSubs = [];
        let myChart = null;

        function updateUILanguage() {
            const t = i18n[currentLang];
            const updates = {
                'auth-subtitle': t.authSubtitle, 'login-btn-text': t.loginBtn, 'welcome-text': t.welcome,
                'logout-btn': t.logout, 'form-title': t.formTitle, 'list-title': t.listTitle,
                'th-name': t.thName, 'th-cycle': t.thCycle, 'th-cost': t.thCost, 'add-btn': t.addBtn,
                'label-name': t.labelName, 'label-category': t.labelCategory, 'label-currency': t.labelCurrency,
                'label-amount': t.labelAmount, 'label-cycle': t.labelCycle, 'label-date': t.labelDate,
                'chart-title': t.chartTitle, 'upcoming-title': t.upcomingTitle
            };
            Object.keys(updates).forEach(id => { if(document.getElementById(id)) document.getElementById(id).innerText = updates[id]; });

            const cat = document.getElementById('category-select');
            const catKeys = ['Entertainment', 'Music', 'Cloud', 'Tools', 'Other'];
            Array.from(cat.options).forEach((opt, i) => opt.text = t.categories[catKeys[i]]);
            
            const cyc = document.getElementById('input_cycle');
            cyc.options[0].text = t.monthly; cyc.options[1].text = t.yearly;

            if(allSubs.length > 0) renderAll();
        }

        async function checkUser() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('user-email').innerText = session.user.email;
                loadData();
            }
            updateUILanguage();
        }

        async function login() { await _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } }); }
        async function logout() { await _supabase.auth.signOut(); location.reload(); }
        function changeLang() { currentLang = document.getElementById('lang-selector').value; localStorage.setItem('preferredLang', currentLang); updateUILanguage(); }

        async function loadData() {
            const { data } = await _supabase.from('subscriptions').select('*');
            if (data) {
                const today = new Date().getDate();
                allSubs = data.map(item => {
                    const rate = { TWD: 1, USD: 32, JPY: 0.21 }[item.category] || 1;
                    const monthlyTWD = item.cycle === 'yearly' ? (item.price * rate) / 12 : (item.price * rate);
                    let daysLeft = item.billing_date - today;
                    if (daysLeft < 0) daysLeft += 30;
                    return { ...item, monthlyTWD, daysLeft };
                });
                renderAll();
            }
        }

        document.getElementById('sub-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data: { session } } = await _supabase.auth.getSession();
            await _supabase.from('subscriptions').insert([{
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('input_price').value),
                cycle: document.getElementById('input_cycle').value,
                category: document.getElementById('input_currency').value,
                category_name: document.getElementById('category-select').value,
                billing_date: parseInt(document.getElementById('input_date').value),
                user_id: session.user.id
            }]);
            document.getElementById('sub-form').reset();
            loadData();
        });

        async function deleteSub(id) { if(confirm(i18n[currentLang].confirmDelete)) { await _supabase.from('subscriptions').delete().eq('id', id); loadData(); } }

        function renderAll() {
            const t = i18n[currentLang];
            const list = document.getElementById('sub-list');
            list.innerHTML = allSubs.map(s => `
                <tr class="hover:bg-slate-800/50 transition">
                    <td class="py-4"><span class="${s.daysLeft <= 3 ? 'status-warning' : 'status-active'}"></span></td>
                    <td class="py-4 font-bold text-sky-400">${s.name}</td>
                    <td class="py-4 text-slate-400">${t[s.cycle]}</td>
                    <td class="py-4 text-right font-mono">NT$ ${Math.round(s.monthlyTWD).toLocaleString()}</td>
                    <td class="py-4 text-right"><button onclick="deleteSub('${s.id}')" class="hover:text-red-400 transition">🗑️</button></td>
                </tr>
            `).join('');

            const total = allSubs.reduce((sum, s) => sum + s.monthlyTWD, 0);
            document.getElementById('monthly-total-display').innerText = `NT$ ${Math.round(total).toLocaleString()}`;

            updateUpcoming();
            updateChart();
        }

        function updateUpcoming() {
            const t = i18n[currentLang];
            const list = document.getElementById('upcoming-list');
            const upcoming = allSubs.filter(s => s.daysLeft <= 7).sort((a, b) => a.daysLeft - b.daysLeft);
            if (upcoming.length === 0) { list.innerHTML = `<p class="text-slate-500 text-center">${t.noData}</p>`; return; }
            list.innerHTML = upcoming.map(s => `
                <div class="flex justify-between items-center p-3 rounded-xl bg-slate-800/50 border border-slate-700">
                    <div><div class="font-bold">${s.name}</div><div class="text-xs text-slate-500">${s.daysLeft === 0 ? t.today : (s.daysLeft === 1 ? t.tomorrow : s.daysLeft + t.daysLeft)}</div></div>
                    <div class="text-emerald-400 font-bold">NT$ ${Math.round(s.monthlyTWD).toLocaleString()}</div>
                </div>
            `).join('');
        }

        function updateChart() {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            const t = i18n[currentLang];
            const dataMap = allSubs.reduce((acc, s) => {
                const key = s.category_name || 'Other';
                const label = t.categories[key] || t.categories.Other;
                acc[label] = (acc[label] || 0) + s.monthlyTWD;
                return acc;
            }, {});

            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(dataMap),
                    datasets: [{
                        data: Object.values(dataMap),
                        backgroundColor: ['#0ea5e9', '#10b981', '#f59e0b', '#6366f1', '#ec4899', '#14b8a6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    maintainAspectRatio: false, cutout: '75%',
                    plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', usePointStyle: true, font: { size: 10 } } } }
                }
            });
        }

        checkUser();
    </script>
</body>
</html>
