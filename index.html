<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeSub Pro - 智能訂閱管理員</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card { background: white; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .status-critical { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="auth-section" class="max-w-md mx-auto mt-20 text-center">
        <h1 class="text-4xl font-bold mb-4 text-gray-900">VibeSub Pro 🚀</h1>
        <p class="text-gray-500 mb-8">掌握每一分訂閱支出</p>
        <button onclick="login()" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-200 py-4 px-4 rounded-2xl hover:shadow-md transition-all font-semibold text-gray-700">
            <img src="https://www.google.com/favicon.ico" class="w-5 h-5"> 使用 Google 帳號登入
        </button>
    </div>

    <div id="dashboard-section" class="hidden max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">歡迎回來 👋</h1>
                <span id="user-email" class="text-sm text-gray-400"></span>
            </div>
            <button onclick="logout()" class="bg-gray-200 hover:bg-gray-300 text-gray-600 px-4 py-2 rounded-xl text-sm transition">登出系統</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card p-6 bg-gradient-to-br from-blue-500 to-blue-600 text-white">
                <p class="opacity-80 text-sm font-medium">每月預估支出</p>
                <h2 id="total-monthly" class="text-3xl font-bold mt-1">NT$ 0</h2>
            </div>
            <div class="card p-6 bg-white border-l-4 border-purple-500">
                <p class="text-gray-400 text-sm">年度累積金額</p>
                <h2 id="total-yearly" class="text-3xl font-bold mt-1 text-gray-800">NT$ 0</h2>
            </div>
            <div class="card p-6 bg-white border-l-4 border-green-500">
                <p class="text-gray-400 text-sm">活躍中的訂閱</p>
                <h2 id="sub-count" class="text-3xl font-bold mt-1 text-gray-800">0</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <div class="card p-6">
                    <h3 class="font-bold mb-4 text-gray-800">✨ 新增服務</h3>
                    <form id="sub-form" class="grid grid-cols-2 md:grid-cols-5 gap-3">
                        <input type="text" id="name" placeholder="服務名稱 (如 Netflix)" class="border p-2.5 rounded-xl col-span-2 md:col-span-1 text-sm" required>
                        <input type="number" id="input_price" placeholder="金額" class="border p-2.5 rounded-xl text-sm" required>
                        <select id="input_cycle" class="border p-2.5 rounded-xl text-sm">
                            <option value="monthly">每月付</option>
                            <option value="yearly">每年付</option>
                        </select>
                        <select id="input_category" class="border p-2.5 rounded-xl text-sm">
                            <option value="娛樂">🍿 娛樂</option>
                            <option value="生活">🏠 生活</option>
                            <option value="工作">💻 工作</option>
                            <option value="其他">📦 其他</option>
                        </select>
                        <input type="number" id="input_date" placeholder="扣款日(1-31)" min="1" max="31" class="border p-2.5 rounded-xl text-sm" required>
                        <button type="submit" class="col-span-2 md:col-span-5 bg-gray-900 text-white py-3 rounded-xl hover:bg-black transition font-bold mt-2">加入清單</button>
                    </form>
                </div>

                <div class="card p-6">
                    <h3 class="font-bold mb-4 text-gray-800">📋 訂閱清單 (按到期日排序)</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="text-gray-400 text-xs uppercase tracking-wider border-b">
                                    <th class="pb-4 font-semibold text-left">服務名稱</th>
                                    <th class="pb-4 font-semibold text-center">類別</th>
                                    <th class="pb-4 font-semibold text-center">扣款狀態</th>
                                    <th class="pb-4 font-semibold text-right">月均費用</th>
                                    <th class="pb-4 font-semibold text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="sub-list" class="divide-y divide-gray-100">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="card p-6 flex flex-col items-center">
                    <h3 class="font-bold mb-6 text-gray-800 w-full text-left">📊 支出分佈 (類別)</h3>
                    <div class="w-full px-4">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
                
                <div id="saving-tip" class="card p-6 bg-yellow-50 border border-yellow-100 hidden">
                    <h4 class="text-yellow-800 font-bold mb-2">💡 省錢小提示</h4>
                    <p id="tip-content" class="text-yellow-700 text-sm"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xqeqjwukfkdluwjchydq.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxZXFqd3VrZmtkbHV3amNoeWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDA1OTIsImV4cCI6MjA5MzU3NjU5Mn0.tO3qfj5DnnK-U2uHxVWLcrCfpyXsqzBeC29Pezi4Z00";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myChart;
        let user;

        async function checkUser() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                user = session.user;
                showDashboard();
                loadData();
            } else {
                showAuth();
            }
        }

        function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-email').innerText = user.email;
        }

        function showAuth() { document.getElementById('auth-section').classList.remove('hidden'); }

        async function login() { await _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } }); }
        async function logout() { await _supabase.auth.signOut(); location.reload(); }

        async function loadData() {
            const { data, error } = await _supabase.from('subscriptions').select('*');
            if (error) return;

            // 計算剩餘天數並排序
            const today = new Date().getDate();
            const sortedData = data.map(item => {
                let daysLeft = item.billing_date - today;
                if (daysLeft < 0) {
                    const lastDayOfMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
                    daysLeft = (lastDayOfMonth - today) + parseInt(item.billing_date);
                }
                return { ...item, daysLeft };
            }).sort((a, b) => a.daysLeft - b.daysLeft);

            renderList(sortedData);
            updateStats(sortedData);
        }

        document.getElementById('sub-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await _supabase.from('subscriptions').insert([{
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('input_price').value),
                cycle: document.getElementById('input_cycle').value,
                category: document.getElementById('input_category').value,
                billing_date: parseInt(document.getElementById('input_date').value),
                user_id: user.id
            }]);

            if (error) alert("錯誤: " + error.message);
            else { document.getElementById('sub-form').reset(); loadData(); }
        });

        async function deleteSub(id) {
            if (confirm('確定刪除？')) { await _supabase.from('subscriptions').delete().eq('id', id); loadData(); }
        }

        function renderList(items) {
            const list = document.getElementById('sub-list');
            list.innerHTML = items.map(item => {
                const monthly = item.cycle === 'yearly' ? (item.price / 12).toFixed(0) : item.price;
                const isUrgent = item.daysLeft <= 3;
                return `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="py-5 font-bold text-gray-800">${item.name}</td>
                        <td class="py-5 text-center"><span class="bg-gray-100 px-3 py-1 rounded-full text-xs text-gray-600">${item.category || '一般'}</span></td>
                        <td class="py-5 text-center">
                            <span class="${isUrgent ? 'text-red-500 font-bold' : 'text-gray-500'} text-sm">
                                ${item.daysLeft === 0 ? '今日扣款' : item.daysLeft + ' 天後'}
                            </span>
                        </td>
                        <td class="py-5 text-right font-bold text-gray-700">NT$ ${Math.round(monthly)}</td>
                        <td class="py-5 text-right text-xl">
                            <button onclick="deleteSub('${item.id}')" class="hover:opacity-50 text-gray-300">🗑️</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats(items) {
            let monthlyTotal = 0;
            items.forEach(item => { monthlyTotal += item.cycle === 'yearly' ? (item.price / 12) : item.price; });

            document.getElementById('total-monthly').innerText = `NT$ ${Math.round(monthlyTotal).toLocaleString()}`;
            document.getElementById('total-yearly').innerText = `NT$ ${Math.round(monthlyTotal * 12).toLocaleString()}`;
            document.getElementById('sub-count').innerText = items.length;

            // 省錢提示
            if (items.length > 0) {
                const maxItem = items.reduce((prev, current) => (prev.price > current.price) ? prev : current);
                document.getElementById('saving-tip').classList.remove('hidden');
                document.getElementById('tip-content').innerText = `你的 ${maxItem.name} 是目前最貴的項目。如果砍掉它，每年能省下 NT$ ${Math.round(maxItem.cycle === 'monthly' ? maxItem.price * 12 : maxItem.price).toLocaleString()}！`;
            }

            updateChart(items);
        }

        function updateChart(items) {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            const catData = items.reduce((acc, item) => {
                const val = item.cycle === 'yearly' ? item.price / 12 : item.price;
                acc[item.category] = (acc[item.category] || 0) + val;
                return acc;
            }, {});

            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catData),
                    datasets: [{
                        data: Object.values(catData),
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: { plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } } }, cutout: '70%' }
            });
        }

        checkUser();
    </script>
</body>
</html>
